<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modelli locali a confronto</title>
    <style>
    :root {
      --ink: #14202b;
      --muted: #5b6b7a;
      --line: #d5dce3;
      --bg: #f3f5f8;
      --panel: #ffffff;
      --ok: #1a7f4b;
      --ok-soft: #dff5e6;
      --ko: #b3264a;
      --ko-soft: #fbe6ec;
      --bar: #1f5fd1;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font:
        18px / 1.45 system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 20px;
      padding: 14px 28px;
      background: var(--ink);
      color: #fff;
    }
    header h1 {
      font-size: 22px;
      margin: 0;
    }
    header span {
      color: #a9b6c4;
      font-size: 15px;
    }
    header .sint {
      margin-left: auto;
      letter-spacing: 0.06em;
    }
    main {
      padding: 18px 28px 40px;
      display: grid;
      gap: 18px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 20px;
      overflow-x: auto;
    }
    h2 {
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-variant-numeric: tabular-nums;
    }
    th,
    td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }
    th {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }
    td.num,
    th.num {
      text-align: right;
    }
    .nome {
      font-weight: 650;
    }
    .nome small {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: 14px;
    }
    .voto {
      display: inline-block;
      min-width: 76px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      text-align: center;
      color: #fff;
    }
    .barra {
      display: inline-block;
      height: 12px;
      border-radius: 6px;
      background: var(--bar);
      vertical-align: middle;
      margin-right: 8px;
    }
    .tipo {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }
    .griglia th.colonna {
      font-size: 13px;
      text-align: center;
      max-width: 150px;
    }
    .griglia td.cella {
      text-align: center;
      padding: 4px;
    }
    .cella button {
      width: 100%;
      min-width: 64px;
      border: 0;
      border-radius: 8px;
      padding: 7px 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .cella .si {
      background: var(--ok-soft);
      color: var(--ok);
    }
    .cella .no {
      background: var(--ko-soft);
      color: var(--ko);
    }
    .cella button[aria-pressed="true"] {
      outline: 3px solid var(--ink);
    }
    .gruppo td {
      background: var(--bg);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #dettaglio[hidden] {
      display: none;
    }
    #dettaglio dl {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 8px 16px;
      margin: 0;
    }
    #dettaglio dt {
      color: var(--muted);
    }
    #dettaglio dd {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #dettaglio .esito {
      font-weight: 700;
    }
    .vuoto {
      color: var(--muted);
    }
    code {
      font:
        15px ui-monospace,
        Menlo,
        Consolas,
        monospace;
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 5px;
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Modelli locali a confronto</h1>
      <span id="quando"></span>
      <span class="sint">DATI SINTETICI · USO DIDATTICO</span>
    </header>
    <main>
      <section>
        <h2>Il risultato di ogni prova</h2>
        <div id="riepilogo"></div>
      </section>
      <section>
        <h2>Domanda per domanda · clic su una casella per vedere la risposta</h2>
        <div id="griglia"></div>
      </section>
      <section id="dettaglio" hidden></section>
      <section>
        <h2>L'agente del mattino con un modello locale</h2>
        <div id="agente"></div>
      </section>
    </main>
    <script src="risultati.js"></script>
    <script>
    // Results of the bench, written by banco.py. Nothing here calls a model.
    const R = window.RISULTATI || { domande: [], corse: [], agente: [] };
    const $ = (id) => document.getElementById(id);
    const esc = (s) =>
      String(s ?? '').replace(
        /[&<>"]/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
      );
    const nome = (c) => c.modello + (c.etichetta ? ` · ${c.etichetta}` : '');
    const colore = (giuste, tutte) =>
      giuste === tutte
        ? '#1a7f4b'
        : giuste >= tutte * 0.75
          ? '#7a8f1d'
          : giuste >= tutte * 0.5
            ? '#b97a12'
            : '#b3264a';
    const TIPI = {
      estrazione: 'Estrazione da un documento',
      fascicolo: 'Fascicolo intero nel contesto',
      sintesi: 'Riassunto in italiano',
      strumento: 'Chiamata a uno strumento',
    };
    let scelta = null;

    // Chi ha fatto la prova e quando: nella stessa tabella stanno le prove dei docenti e quelle del gruppo.
    const dove = (c) =>
      `${esc(c.macchina || 'computer non indicato')}, ${c.quando.slice(8, 10)}/${c.quando.slice(5, 7)} ${c.quando.slice(11, 16)}`;

    function riepilogo() {
      if (!R.corse.length)
        return '<p class="vuoto">Nessuna prova salvata. Eseguire <code>python3 banco.py &lt;modello&gt;</code>.</p>';
      const massimo = (campo) => Math.max(...R.corse.map((c) => c[campo] || 0), 0.001);
      const veloce = massimo('token_al_secondo'),
        memoria = massimo('memoria_gb');
      const righe = R.corse.map((c) => {
        const tipi = Object.entries(c.per_tipo)
          .filter(([, [, n]]) => n)
          .map(([t, [g, n]]) => `<span class="tipo">${TIPI[t].split(' ')[0]} ${g}/${n}</span>`)
          .join(' · ');
        return `<tr><td class="nome">${esc(nome(c))}<small>${esc(c.parametri || '')} · ${esc(c.quantizzazione || '')} · contesto ${c.contesto}${c.vincolato ? ' · JSON vincolato' : ''}${c.ragiona ? ' · con ragionamento' : ''}<br>${dove(c)}</small></td>
            <td><span class="voto" style="background:${colore(c.corrette, c.domande)}">${c.corrette} / ${c.domande}</span></td><td>${tipi}</td>
            <td class="num">${c.primo_token_s ?? 'n.d.'} s</td>
            <td><span class="barra" style="width:${Math.round(((c.token_al_secondo || 0) / veloce) * 140)}px"></span>${c.token_al_secondo ?? 'n.d.'}</td>
            <td><span class="barra" style="width:${Math.round(((c.memoria_gb || 0) / memoria) * 140)}px;background:#7a5cc4"></span>${c.memoria_gb ?? 'n.d.'} GB</td></tr>`;
      });
      return `<table><tr><th>Modello</th><th>Risposte corrette</th><th>Per tipo</th><th class="num">Primo token</th><th>Token al secondo</th><th>Memoria del modello caricato</th></tr>${righe.join('')}</table>`;
    }

    function griglia() {
      if (!R.corse.length) return '';
      const testa = `<tr><th>Domanda</th>${R.corse.map((c) => `<th class="colonna">${esc(nome(c))}</th>`).join('')}</tr>`;
      let ultimo = null;
      const righe = R.domande.map((d) => {
        const gruppo =
          d.tipo !== ultimo
            ? `<tr class="gruppo"><td colspan="${R.corse.length + 1}">${TIPI[d.tipo]}</td></tr>`
            : '';
        ultimo = d.tipo;
        const celle = R.corse.map((c, i) => {
          const e = c.esiti.find((x) => x.id === d.id);
          if (!e) return '<td class="cella vuoto">n.d.</td>';
          const premuto = scelta && scelta.corsa === i && scelta.id === d.id;
          return `<td class="cella"><button type="button" class="${e.ok ? 'si' : 'no'}" aria-pressed="${premuto}" data-corsa="${i}" data-id="${d.id}">${e.ok ? 'OK' : 'NO'}</button></td>`;
        });
        return `${gruppo}<tr><td><b>${d.id}</b> ${esc(d.titolo)}</td>${celle.join('')}</tr>`;
      });
      return `<table class="griglia">${testa}${righe.join('')}</table>`;
    }

    function dettaglio() {
      if (!scelta) return '';
      const c = R.corse[scelta.corsa],
        d = R.domande.find((x) => x.id === scelta.id),
        e = c.esiti.find((x) => x.id === scelta.id);
      const atteso = d.atteso
        ? JSON.stringify(d.atteso)
        : `deve contenere: ${d.deve_contenere.join(' · ')}`;
      const risposta =
        e.chiamate && e.chiamate.length
          ? JSON.stringify(
              e.chiamate.map((x) => x.function),
              null,
              1
            )
          : e.testo || '(nessuna risposta)';
      return `<h2>${esc(nome(c))} · ${d.id} ${esc(d.titolo)}</h2><dl>
          <dt>Esito</dt><dd class="esito" style="color:${e.ok ? 'var(--ok)' : 'var(--ko)'}">${e.ok ? 'corretta' : 'sbagliata'}${e.motivo ? ' · ' + esc(e.motivo) : ''}</dd>
          <dt>Domanda</dt><dd>${esc(d.domanda)}</dd><dt>Risposta attesa</dt><dd>${esc(atteso)}</dd><dt>Risposta del modello</dt><dd>${esc(risposta)}</dd>
          <dt>Misure</dt><dd>primo token ${e.primo_token_s ?? 'n.d.'} s · ${e.token_al_secondo ?? 'n.d.'} token/s · ${e.token ?? 0} token · ${e.secondi ?? 'n.d.'} s</dd></dl>`;
    }

    function agente() {
      if (!R.agente.length)
        return '<p class="vuoto">Nessuna prova salvata. Eseguire <code>python3 agente_locale.py &lt;modello&gt;</code>.</p>';
      const si = (v) =>
        `<span style="color:${v ? 'var(--ok)' : 'var(--ko)'};font-weight:700">${v ? 'sì' : 'no'}</span>`;
      const righe = R.agente.map(
        (
          a
        ) => `<tr><td class="nome">${esc(a.modello)}<small>contesto ${a.contesto}<br>${dove(a)}</small></td><td class="num">${a.agente.documenti_letti} / ${a.agente.documenti}</td>
          <td>${si(a.agente.email_inviata)}</td><td><span class="voto" style="background:#33414f">${a.agente.eventi ? `${a.agente.eventi_trovati} / ${a.agente.eventi}` : 'n.d.'}</span></td>
          <td class="num">${a.agente.secondi} s</td><td>${esc(a.agente.nota || '')}</td></tr>`
      );
      return `<table><tr><th>Modello</th><th class="num">Documenti letti</th><th>Email inviata</th><th>Eventi della cronologia trovati</th><th class="num">Durata</th><th>Che cosa è successo</th></tr>${righe.join('')}</table>`;
    }

    function disegna() {
      const ultime = R.corse
        .map((c) => c.quando)
        .sort()
        .pop();
      $('quando').textContent = ultime
        ? `ultima prova ${ultime.slice(8, 10)}/${ultime.slice(5, 7)}/${ultime.slice(0, 4)} ${ultime.slice(11, 16)}`
        : '';
      $('riepilogo').innerHTML = riepilogo();
      $('griglia').innerHTML = griglia();
      $('dettaglio').innerHTML = dettaglio();
      $('dettaglio').hidden = !scelta;
      $('agente').innerHTML = agente();
    }
    document.addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-id]');
      if (!b) return;
      scelta = { corsa: +b.dataset.corsa, id: b.dataset.id };
      disegna();
      $('dettaglio').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    disegna();
    </script>
  </body>
</html>
