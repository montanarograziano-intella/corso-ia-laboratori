[project]
name = "visione-notebook"
version = "0.1.0"
description = "Day 3 computer vision notebook: detection, groups, OCR, visual search and a VLM on a small test set"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=6",
    "ipywidgets>=8",
    "jupyterlab>=4",
    "num2words>=0.5",
    "numpy>=2",
    "pillow>=11",
    "python-doctr>=1.0",
    "sentence-transformers>=5",
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
