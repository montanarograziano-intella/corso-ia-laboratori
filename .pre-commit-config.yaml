---
# Run with prek: `uvx prek install` once, then hooks run on every commit; `uvx prek run --all-files` by hand.
default_stages: [pre-commit]
# The case-file documents and the lab datasets are cited by line number: no hook rewrites them.
exclude: ^data/|/distrattori/|\.csv$|/visore/risultati\.js$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
